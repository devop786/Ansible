---

- name: Copy join command to slave nodes
  copy:
    # Use full path (no ~ expansion in Ansible)
    src: /home/ubuntu/aa/Ansible/playbook/kubeadmsetup/kube_join_command.sh
    dest: /tmp/kube_join_command.sh
    mode: '0755'
  become: yes

- name: Execute join command on slave nodes
  shell: "/bin/bash /tmp/kube_join_command.sh"
  register: join_output
  become: yes
  changed_when: join_output.rc == 0
  retries: 2
  delay: 10
  until: join_output.rc == 0

- name: Print join command output
  debug:
    msg: "{{ join_output.stdout_lines }}"

